# Checks every change to the catalog the way nano parses it.
name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Sync tool unit tests
        run: python3 -m unittest discover -s tools/sync

      - name: Check models.yaml and agent_defaults.yaml
        run: cargo run --quiet --locked --release --manifest-path tools/catalog-check/Cargo.toml -- .
