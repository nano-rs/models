# Default Agent Model Assignments
# Synced to nano instances alongside models.yaml.
# Used to seed agent_model_config when no custom config exists.
#
# Each provider section maps agent IDs to model IDs from models.yaml.
# Agents not listed inherit from the "_default" key for that provider.
#
# Agent tiers:
#   capable: complex reasoning, large context (detection, parser, notebook, investigation, shadow hunting, enrichment, hunt investigator, hunt reviewer)
#   fast:    high-throughput / low-latency (query, summarize, tuning, validation, ai_pipe, hunt recheck)
#   mid:     moderate complexity (dashboard, timeline, parser_edit, shadow_narrative)
#
# Note: max_tokens are intentionally high: SIEM agents work with large log payloads,
# detection rule sets, and multi-event timelines that can easily fill 16-32K+ tokens.
#
# temperature is ignored for models flagged supports_temperature: false in
# models.yaml (nano omits it on the request).
#
# reasoning_effort (optional, per tier): how hard a reasoning model thinks:
# none | minimal | low | medium | high | xhigh | max (what each model accepts
# varies; nano sends `minimal` as `low` to GPT-6.x). nano v2.0.37+ applies it
# to catalog-managed agents on sync; omit it to leave each agent's current
# effort unchanged. Older builds ignore it.

providers:
  anthropic:
    _default:
      model_id: anthropic/claude-sonnet-5-5
      max_tokens: 16384
      temperature: 0.7
    capable:
      model_id: anthropic/claude-sonnet-5-5
      max_tokens: 32768
      temperature: 0.5
    fast:
      model_id: anthropic/claude-haiku-5-5
      max_tokens: 16384
      temperature: 0.3

  google:
    _default:
      model_id: gemini/gemini-3.1-pro-preview
      max_tokens: 16384
      temperature: 0.7
    capable:
      model_id: gemini/gemini-3.1-pro-preview
      max_tokens: 32768
      temperature: 0.5
    fast:
      model_id: gemini/gemini-3.5-flash-lite
      max_tokens: 16384
      temperature: 0.3

  openai:
    _default:
      model_id: openai/gpt-5.6-sol
      max_tokens: 16384
      temperature: 0.7
    capable:
      model_id: openai/gpt-5.6-sol
      max_tokens: 32768
      temperature: 0.5
    fast:
      model_id: openai/gpt-5.6-luna
      max_tokens: 16384
      temperature: 0.3

  bedrock:
    _default:
      model_id: bedrock/global.anthropic.claude-sonnet-5-5
      max_tokens: 16384
      temperature: 0.7
    capable:
      model_id: bedrock/global.anthropic.claude-sonnet-5-5
      max_tokens: 32768
      temperature: 0.5
    fast:
      model_id: bedrock/global.anthropic.claude-haiku-5-5
      max_tokens: 16384
      temperature: 0.3

  # Cloudflare Workers AI (GLM-5.3), the low-cost default.
  # capable/mid fall back to _default; fast (query, summarize, tuning, ...) uses
  # DeepSeek V4.1 Flash because query building is latency-sensitive.
  # (GLM-5.3 Flash was retired by Cloudflare on 2026-11-20.)
  workers-ai:
    _default:
      model_id: workers-ai/@cf/zai-org/glm-5.3
      max_tokens: 16384
      temperature: 0.7
    capable:
      model_id: workers-ai/@cf/zai-org/glm-5.3
      max_tokens: 32768
      temperature: 0.5
    fast:
      model_id: workers-ai/@cf/deepseek-ai/deepseek-v4.1-flash-1017
      max_tokens: 16384
      temperature: 0.3
      # DeepSeek V4.1 Flash reasons at `high` by default (accepts none, low,
      # high, max). `low` keeps query building fast. Read by nano v2.0.37+;
      # older builds ignore it.
      reasoning_effort: low

# Map each agent to a tier
agents:
  query: fast
  detection: capable
  parser: capable
  parser_edit: capable
  summarize: fast
  dashboard: mid
  timeline: mid
  notebook: capable
  query_correction: fast
  query_best_practices: fast
  investigation: capable
  shadow_hunting: capable
  shadow_narrative: mid
  # Hunts v2 (NAN-5543), shipped since v2.0.32. nano seeds these rows as
  # catalog-managed, so listing them here retargets them on the next sync.
  hunt_recheck: fast
  hunt_investigator: capable
  hunt_reviewer: capable
  closure_summary: fast
  tuning_auto: fast
  tuning_hint: fast
  concierge: fast
  enrichment_codegen: capable
  udm_validation: fast
  ai_pipe: fast
