  # OpenAI (developers.openai.com/api/docs/models)
  # GPT-6.x and GPT-5.6 share a 1,050,000 context window and 128K max output.
  # All are reasoning models; `temperature` is omitted for them.
  - model_id: openai/gpt-6.2-astra
    display_name: GPT-6.2 Astra
    context_window: 1050000
    supports_temperature: false
    tier: full

  - model_id: openai/gpt-6.2-sol
    display_name: GPT-6.2 Sol
    context_window: 1050000
    supports_temperature: false
    tier: standard

  - model_id: openai/gpt-6.1-terra
    display_name: GPT-6.1 Terra
    context_window: 1050000
    supports_temperature: false
    tier: economy

  - model_id: openai/gpt-6-luna
    display_name: GPT-6 Luna
    context_window: 1050000
    supports_temperature: false
    tier: economy

  # Previous generation: not deprecated by OpenAI, kept so existing agent
  # configs keep working.
  - model_id: openai/gpt-5.6-sol
    display_name: GPT-5.6 Sol
    context_window: 1050000
    supports_temperature: false
    tier: full

  - model_id: openai/gpt-5.6-terra
    display_name: GPT-5.6 Terra
    context_window: 1050000
    supports_temperature: false
    tier: standard

  - model_id: openai/gpt-5.6-luna
    display_name: GPT-5.6 Luna
    context_window: 1050000
    supports_temperature: false
    tier: economy

  # Cloudflare Workers AI (developers.cloudflare.com/workers-ai/models/)
  # @cf/zai-org/glm-5.3-flash was removed: Cloudflare retired it on
  # 2026-11-20 (HTTP 410). GLM-5.3 is the default for every Workers AI tier.
  # GLM-5.3: 1,048,576-token context, function calling, $1.40 / $4.40 per M
  # input / output tokens ($0.26 cached input), per
  # developers.cloudflare.com/workers-ai/models/glm-5.3/ (checked 2026-11-25).
  - model_id: workers-ai/@cf/zai-org/glm-5.3
    display_name: GLM-5.3 (Cloudflare)
    context_window: 1048576
    tier: economy

  # Optional, not a default. DeepSeek V4.1 Flash: 1,048,576-token context,
  # function calling, $0.30 / $1.20 per M input / output tokens.
  - model_id: workers-ai/@cf/deepseek-ai/deepseek-v4.1-flash-1017
    display_name: DeepSeek V4.1 Flash (Cloudflare)
    context_window: 1048576
    tier: economy
