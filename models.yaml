# nano Model Catalog
# Synced to nano instances via Settings > AI Configuration > Sync Upstream
#
# Format:
#   model_id: provider/model-name (e.g. anthropic/claude-sonnet-5-5)
#   display_name: Human-readable name shown in the UI
#   context_window: Max context window in tokens (optional)
#   supports_temperature: false for thinking-default / reasoning models that
#         reject the `temperature` parameter (optional, defaults to true)
#   tier: Cost/access class: economy | standard | full (optional).
#         Drives AI credit billing (economy = lite, 2 credits; standard/full =
#         10) and plan gating. Omit only for models whose cost is unknown.
#
# Removing a model from this file marks it deprecated on the next sync (it is
# never deleted). Only remove a model once its provider has retired it or the
# ID cannot be called through nano's gateway.

models:
  # Anthropic (Direct API)
  # Current generation (platform.claude.com/docs/en/about-claude/models/overview).
  # All four reject `temperature`.
  - model_id: anthropic/claude-fable-5-2
    display_name: Claude Fable 5.2
    context_window: 1000000
    supports_temperature: false
    tier: full

  - model_id: anthropic/claude-opus-5-5
    display_name: Claude Opus 5.5
    context_window: 1000000
    supports_temperature: false
    tier: full

  - model_id: anthropic/claude-sonnet-5-5
    display_name: Claude Sonnet 5.5
    context_window: 1000000
    supports_temperature: false
    tier: standard

  - model_id: anthropic/claude-haiku-5-5
    display_name: Claude Haiku 5.5
    context_window: 1000000
    supports_temperature: false
    tier: economy

  # Previous generation: still served by Anthropic, kept so existing agent
  # configs keep working.
  - model_id: anthropic/claude-opus-5
    display_name: Claude Opus 5
    context_window: 1000000
    supports_temperature: false
    tier: full

  - model_id: anthropic/claude-sonnet-5
    display_name: Claude Sonnet 5
    context_window: 1000000
    supports_temperature: false
    tier: standard

  - model_id: anthropic/claude-haiku-4-5
    display_name: Claude Haiku 4.5
    context_window: 200000
    tier: economy

  # Anthropic (AWS Bedrock)
  # nano calls Bedrock through the bedrock-runtime Converse API. On that
  # endpoint the current Claude models are served through inference profiles,
  # so these use the global cross-Region profile IDs, which work from any
  # Region (docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-*).
  # For data residency, add a custom model with a geo profile (us., eu., au.).
  - model_id: bedrock/global.anthropic.claude-fable-5-2
    display_name: Claude Fable 5.2 (Bedrock)
    context_window: 1000000
    supports_temperature: false
    tier: full

  - model_id: bedrock/global.anthropic.claude-opus-5-5
    display_name: Claude Opus 5.5 (Bedrock)
    context_window: 1000000
    supports_temperature: false
    tier: full

  - model_id: bedrock/global.anthropic.claude-sonnet-5-5
    display_name: Claude Sonnet 5.5 (Bedrock)
    context_window: 1000000
    supports_temperature: false
    tier: standard

  - model_id: bedrock/global.anthropic.claude-haiku-5-5
    display_name: Claude Haiku 5.5 (Bedrock)
    context_window: 1000000
    supports_temperature: false
    tier: economy

  # Google Gemini (aistudio.google.com/docs/models)
  - model_id: gemini/gemini-4-carbon
    display_name: Gemini 4 Carbon
    context_window: 1048576
    tier: full

  - model_id: gemini/gemini-4-argon
    display_name: Gemini 4 Argon
    context_window: 1048576
    tier: full

  - model_id: gemini/gemini-4-neon
    display_name: Gemini 4 Neon
    context_window: 1048576
